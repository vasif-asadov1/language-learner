name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            executable_name: LanguageLearner-Linux
            # PyInstaller on Linux produces a file named exactly after the --name flag
            artifact_name: LanguageLearner
          - os: windows-latest
            executable_name: LanguageLearner-Windows.exe
            # PyInstaller on Windows appends .exe automatically
            artifact_name: LanguageLearner.exe

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller PyQt6 deep-translator requests fpdf2 arabic-reshaper python-bidi gTTS pygame

    - name: Build Application
      run: pyinstaller --onefile --windowed --icon="images/icon.ico" --hidden-import="bidi.algorithm" --name "LanguageLearner" main.py

    - name: Rename Artifacts
      shell: bash
      run: |
        mv "dist/${{ matrix.artifact_name }}" "dist/${{ matrix.executable_name }}"

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: dist/${{ matrix.executable_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}